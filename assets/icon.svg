<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Dusk Depot">
  <title>Dusk Depot</title>

  <!--
    主图标：绿色的"纸"，白色的节点图。四个节点、九条线，疏。

      dd-face  版面 —— 左上亮、右下深
      dd-sheen 一道斜向高光
      dd-hero  主节点是个球，不是一块白斑
      dd-fade  向外的四根越走越淡，到纸的边缘之前就化掉

    节点三档：大球 = 这篇本身；两个实心 = 已存在的相邻笔记；
    空心环 = 还没建出来的那篇（旧项目里"指向不存在笔记"画的就是虚环）。
  -->
  <defs>
    <clipPath id="dd-tile">
      <rect x="0" y="0" width="128" height="128" rx="28"/>
    </clipPath>

    <linearGradient id="dd-face" x1="0.05" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2acb95"/>
      <stop offset="0.5" stop-color="#0e9b66"/>
      <stop offset="1" stop-color="#054e38"/>
    </linearGradient>

    <linearGradient id="dd-sheen" x1="0.08" y1="0" x2="0.58" y2="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dd-hero" cx="0.36" cy="0.3" r="0.82">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eefcf6"/>
      <stop offset="1" stop-color="#b3e8d2"/>
    </radialGradient>

    <radialGradient id="dd-fade" gradientUnits="userSpaceOnUse" cx="70" cy="60" r="82">
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <mask id="dd-mask">
      <rect x="0" y="0" width="128" height="128" fill="url(#dd-fade)"/>
    </mask>
  </defs>

  <g clip-path="url(#dd-tile)">
    <rect x="0" y="0" width="128" height="128" fill="url(#dd-face)"/>
    <rect x="0" y="0" width="128" height="128" fill="url(#dd-sheen)"/>

    <!-- 骨架：实白，最粗 -->
    <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <path d="M76 44 L42 74"/>
      <path d="M76 44 L86 81"/>
      <path d="M42 74 L55.9 91.7"/>
    </g>

    <!-- 网络：半透明白，细一档 -->
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <path d="M42 74 L86 81"/>
      <path d="M86 81 L65.7 93.5"/>
    </g>

    <!-- 向外的四根：靠 dd-fade 越走越淡 -->
    <g mask="url(#dd-mask)" fill="none" stroke="#ffffff" stroke-width="3"
       stroke-linecap="round" opacity="0.85">
      <path d="M76 44 L120 4"/>
      <path d="M42 74 L10 124"/>
      <path d="M86 81 L122 112"/>
      <path d="M59.2 103.7 L56 132"/>
    </g>

    <!-- 节点：两个实心、一个空心、一个球 -->
    <circle cx="42" cy="74" r="7" fill="#ffffff"/>
    <circle cx="86" cy="81" r="6" fill="#ffffff"/>
    <circle cx="60" cy="97" r="5.2" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="76" cy="44" r="14" fill="url(#dd-hero)"/>
  </g>
</svg>
