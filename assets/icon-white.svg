<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Dusk Depot">
  <title>Dusk Depot（白底版）</title>

  <!--
    白底版：跟第一版一样，白纸 + 墨绿骨架 + 绿色连线。
    适合放在浅色界面里当标记（空态、加载骨架、关于页），不适合当 app icon ——
    小尺寸下白方块会糊掉，绿也不够立得住。
  -->
  <defs>
    <clipPath id="dd-sheet-w">
      <rect x="12" y="12" width="104" height="104" rx="18"/>
    </clipPath>
  </defs>

  <rect x="12" y="12" width="104" height="104" rx="18" fill="#ffffff"/>

  <g clip-path="url(#dd-sheet-w)" fill="none" stroke-linecap="round">
    <g stroke="#10231c" stroke-width="3.6">
      <path d="M78 43 L43 73"/>
      <path d="M78 43 L85 80"/>
      <path d="M43 73 L61 97"/>
    </g>
    <g stroke="#0fa36b" stroke-width="3">
      <path d="M43 73 L85 80"/>
      <path d="M85 80 L61 97"/>
      <path d="M78 43 L112 8"/>
      <path d="M43 73 L16 116"/>
      <path d="M85 80 L116 104"/>
      <path d="M61 97 L56 124"/>
    </g>
  </g>

  <rect x="12" y="12" width="104" height="104" rx="18" fill="none" stroke="#10231c" stroke-width="4.4"/>

  <circle cx="78" cy="43" r="12.8" fill="#0fa36b"/>
  <circle cx="43" cy="73" r="6.6" fill="#ffffff" stroke="#10231c" stroke-width="3.6"/>
  <circle cx="85" cy="80" r="5.8" fill="#ffffff" stroke="#10231c" stroke-width="3.6"/>
  <circle cx="61" cy="97" r="4.4" fill="#ffffff" stroke="#0fa36b" stroke-width="3.4"/>
</svg>
